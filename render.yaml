services:
  - type: web
    name: ai-news-aggregator
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python app/database/create_tables.py
    startCommand: python main.py
    autoDeploy: true
  
databases:
  - name: ai-news-db
    databaseName: ai_news_aggregator
    plan: free
