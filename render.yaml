services:
  - type: web
    name: ai-news-aggregator
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from app.database.models import Base; from app.database.connection import engine; Base.metadata.create_all(engine); print('✓ Database initialized')" && python app/web_service.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
  
databases:
  - name: ai-news-db
    databaseName: ai_news_aggregator
    plan: free
